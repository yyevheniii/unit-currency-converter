<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют і одиниць</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Шапка з назвою застосунку -->
  <header>
    <h1>Конвертер валют і одиниць</h1>
  </header>

  <main>
    <!-- Блок вибору типу конвертації (валюта/довжина/вага) -->
    <section id="conversion-type">
      <h2>Вибір типу конвертації</h2>
    </section>

    <!-- Vue-компонент форми конвертації (практикум 10) -->
    <section id="converter">
      <h2>Форма конвертації</h2>
      <div id="app">
        <converter-form :rates="rates"></converter-form>
      </div>
    </section>

    <!-- Список курсів валют -->
    <section id="rates">
      <h2>Курси валют</h2>
      <button type="button" id="refresh-button">Оновити</button>
      <p id="rates-status"></p>
      <p id="rates-error"></p>
      <p id="rates-info">Базова валюта: —, дата: —</p>
      <ul id="rates-list"></ul>
      <p id="rates-count">Кількість валют: —</p>
    </section>
  </main>

  <!-- Підвал -->
  <footer>
    <p>Курс є орієнтовним і може відрізнятися від актуального банківського курсу.</p>
  </footer>

</body>
</html>
