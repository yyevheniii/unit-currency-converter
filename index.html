<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют і одиниць</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Шапка з назвою застосунку -->
  <header>
    <h1>Конвертер валют і одиниць</h1>
  </header>

  <main>
    <!-- Блок вибору типу конвертації (валюта/довжина/вага) -->
    <section id="conversion-type">
      <h2>Вибір типу конвертації</h2>
    </section>

    <!-- Форма введення значення й одиниць -->
    <!-- Блок результату -->
    <section id="conversion-form">
      <h2>Форма конвертації</h2>
      <form id="converter-form">
        <label for="amount-input">Значення</label>
        <input type="number" id="amount-input" name="amount" required min="0.01" step="any">

      <div class="unit-row">
        <div class="unit-field">
          <label for="from-unit">З одиниці</label>
          <select id="from-unit" name="from-unit">
            <option value="usd">USD</option>
            <option value="eur">EUR</option>
            <option value="uah">UAH</option>
          </select>
        </div>

        <button type="button" class="swap-button" aria-label="Поміняти місцями одиниці">⇄</button>

        <div class="unit-field">
          <label for="to-unit">В одиницю</label>
          <select id="to-unit" name="to-unit">
            <option value="usd">USD</option>
            <option value="eur">EUR</option>
            <option value="uah">UAH</option>
          </select>
        </div>
      </div>

        <button type="submit">Конвертувати</button>
      </form>

      <p id="result">Результат: —</p>
    </section>

    <!-- Історія конвертацій -->
    <section id="history">
      <h2>Історія конвертацій</h2>
      <ul id="history-list"></ul>
    </section>

    <!-- Список курсів валют -->
    <section id="rates">
      <h2>Курси валют</h2>
      <button type="button" id="refresh-button">Оновити</button>
      <p id="rates-status"></p>
      <p id="rates-error"></p>
      <p id="rates-info">Базова валюта: —, дата: —</p>
      <ul id="rates-list"></ul>
      <p id="rates-count">Кількість валют: —</p>
    </section>
  </main>

  <!-- Підвал -->
  <footer>
    <p>Курс є орієнтовним і може відрізнятися від актуального банківського курсу.</p>
  </footer>
</body>
</html>
