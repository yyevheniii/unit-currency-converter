<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют і одиниць</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Шапка з назвою застосунку та меню SPA -->
  <header>
    <h1>Конвертер валют і одиниць</h1>
    <nav>
      <a href="#/" data-link>Конвертація</a>
      <a href="#/history" data-link>Історія</a>
    </nav>
  </header>

  <main>
    <!-- Блок вибору типу конвертації (валюта/довжина/вага); показується лише на головній -->
    <section id="conversion-type" class="home-only">
      <h2>Вибір типу конвертації</h2>
    </section>

    <!-- Практикум 13: контейнер SPA, у який роутер рендерить усі «сторінки» -->
    <div id="page"></div>

    <!-- Список курсів валют; показується лише на головній -->
    <section id="rates" class="home-only">
      <h2>Курси валют</h2>
      <button type="button" id="refresh-button">Оновити</button>
      <p id="rates-status"></p>
      <p id="rates-error"></p>
      <p id="rates-info">Базова валюта: —, дата: —</p>
      <ul id="rates-list"></ul>
      <p id="rates-count">Кількість валют: —</p>
    </section>
  </main>

  <!-- Підвал -->
  <footer>
    <p>Курс є орієнтовним і може відрізнятися від актуального банківського курсу.</p>
  </footer>

</body>
</html>
